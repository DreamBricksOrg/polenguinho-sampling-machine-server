<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLENGUINHO - Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {% if encryption_enabled %}
    <script src="/templates/sample/js/crypt/util.js"></script>
    <script src="/templates/sample/js/crypt/aes_encryption.js"></script>
    <script src="/templates/sample/js/crypt/rsa_encryption.js"></script>
    <script src="/templates/sample/js/crypt/db_encryption.js"></script>
    {% endif %}
    <link rel="stylesheet" href="/templates/sample/assets/css/form.css">
</head>

<body>
    <div class="container">
        <div class="content">

            <form id="formulario">
                <label for="email" class="form-label">INSIRA O SEU E-MAIL</label>
                <input type="email" id="email" name="email" class="form-input" autocomplete="off" required>
                <div id="email-erro" class="form-error" style="display:none;"></div>

                <div class="campo-termos">
                    <input type="checkbox" name="termos" id="termos" required>
                    <label for="termos" class="form-label label-termos">LI E CONCORDO COM OS <a
                            href="/templates/sample/docs/Termo_Uso_Protecao_Dados_e_Anexo_Formulario_DrogaVET_Paulista_vf.pdf"
                            target="_blank" rel="noopener">TERMOS E CONDIÇÕES.</a></label>
                </div>
                <div id="termos-erro" class="form-error" style="display:none;"></div>
            </form>

            <button class="btn" id="btn-enviar" onclick="submitForm()">AVANÇAR</button>
        </div>
    </div>

    <script>
        const COLLECTION = 'registrations';
        const ENCRYPTION_ENABLED = {{ 'true' if encryption_enabled else 'false' }};

        function getUrlParameter(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function saveSessionData() {
            const sessionId = getUrlParameter('sid');
            const slug = getUrlParameter('slug');
            if (sessionId) {
                localStorage.setItem('session_id', sessionId);
            }
            if (slug) {
                localStorage.setItem('slug', slug);
            }
        }

        function validarEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        const emailInput = document.getElementById('email');
        const termosInput = document.getElementById('termos');
        const emailErro = document.getElementById('email-erro');
        const termosErro = document.getElementById('termos-erro');

        function validarCampo(input, erroEl, valido, mensagemVazio, mensagemInvalido, obrigatorio) {
            const vazio = input.value.trim() === '';

            if (vazio && !obrigatorio) {
                erroEl.textContent = '';
                erroEl.style.display = 'none';
                input.classList.remove('invalid');
                return false;
            }

            if (vazio) {
                erroEl.textContent = mensagemVazio;
                erroEl.style.display = 'block';
                input.classList.add('invalid');
                return false;
            }

            if (!valido) {
                erroEl.textContent = mensagemInvalido;
                erroEl.style.display = 'block';
                input.classList.add('invalid');
                return false;
            }

            erroEl.textContent = '';
            erroEl.style.display = 'none';
            input.classList.remove('invalid');
            return true;
        }

        function validarTermos(obrigatorio) {
            if (termosInput.checked) {
                termosErro.textContent = '';
                termosErro.style.display = 'none';
                return true;
            }

            if (obrigatorio) {
                termosErro.textContent = 'Você precisa aceitar os termos para continuar.';
                termosErro.style.display = 'block';
            }
            return false;
        }

        function validarCampos(obrigatorio) {
            const emailValido = validarCampo(
                emailInput, emailErro, validarEmail(emailInput.value),
                'E-mail é obrigatório.', 'E-mail inválido.', obrigatorio
            );
            const termosValido = validarTermos(obrigatorio);

            return emailValido && termosValido;
        }

        emailInput.addEventListener('input', () => validarCampos(false));
        termosInput.addEventListener('change', () => validarCampos(false));

        async function buildPayload(sessionId) {
            const email = emailInput.value.trim();

            if (!ENCRYPTION_ENABLED) {
                return { email, code: sessionId };
            }

            const publicKeyResponse = await fetch('/templates/sample/js/crypt/public_key.pem');
            if (!publicKeyResponse.ok) {
                throw new Error('Não foi possível carregar a chave pública de criptografia.');
            }
            const publicKeyPem = await publicKeyResponse.text();

            const emailHashBuffer = await _digestMessage(email.toLowerCase());
            const emailHash = _arrayBufferToHexString(emailHashBuffer);

            return {
                code: sessionId,
                encrypted: true,
                emailHash,
                encEmail: await dbEncryptString(email, publicKeyPem),
            };
        }

        async function tryCreateUser(payload) {
            const res = await fetch(`/api/users/?collection=${COLLECTION}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            return { ok: res.ok, status: res.status, data };
        }

        // Marca a sessão como terms_accepted e amarra o cadastro à sessão — é
        // por esse user_id que o servidor marca a retirada quando a máquina
        // confirmar o brinde. Falha aqui não bloqueia o fluxo: a retirada
        // aceita tanto form_shown quanto terms_accepted.
        async function markTermsAccepted(sessionId, userId) {
            if (!sessionId) return;
            try {
                await fetch('/api/sample/session/terms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        user_id: userId || null,
                        collection: COLLECTION,
                    }),
                });
            } catch (_) { }
        }

        function redirectToContinue() {
            const queryString = new URLSearchParams(window.location.search).toString();
            window.location.href = queryString
                ? `/api/sample/continue?${queryString}`
                : '/api/sample/continue';
        }

        async function submitForm(e) {
            if (e) e.preventDefault();
            if (!validarCampos(true)) return;

            const sessionId = localStorage.getItem('session_id') || '';

            try {
                const payload = await buildPayload(sessionId);
                const res = await tryCreateUser(payload);

                if (res.ok) {
                    await markTermsAccepted(sessionId, res.data && res.data.id);
                    redirectToContinue();
                } else if (res.status === 429) {
                    window.location.href = '/templates/sample/html/error.html';
                } else {
                    const msg = (res.data && (res.data.detail || res.data.message)) || 'Erro ao cadastrar';
                    await Swal.fire({ icon: 'error', title: 'Erro', text: msg, confirmButtonText: 'OK' });
                }
            } catch (_) {
                await Swal.fire({
                    icon: 'error',
                    title: 'Erro',
                    text: 'Ocorreu um erro inesperado. Tente novamente.',
                    confirmButtonText: 'OK',
                });
            }
        }

        document.getElementById('formulario').addEventListener('submit', submitForm);

        document.addEventListener('DOMContentLoaded', saveSessionData);
    </script>
</body>

</html>
