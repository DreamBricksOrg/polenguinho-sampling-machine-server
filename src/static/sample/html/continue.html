<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Machine - Liberando sua amostra</title>
    <link rel="stylesheet" href="/templates/sample/assets/css/continue.css">
</head>

<body>
    <div class="container">
        <div class="content">
            <!-- Caminho absoluto: a página é servida em /api/sample/continue, então
                 um caminho relativo resolveria para /api/assets/... e daria 404. -->
            <div class="images">
                <img class="arrow" src="/templates/sample/assets/images/seta.png" alt="">
                <img class="message" src="/templates/sample/assets/images/Continue%20no%20%20totem.png"
                    alt="Continue no totem">
            </div>
        </div>
    </div>

    <script>
        const POLL_INTERVAL_MS = 2000;
        const POLL_MAX_MS = 90000;

        // Falha aqui é problema na liberação, não "já retirou" — por isso vai
        // para failed.html, e não para o error.html do bloqueio.
        function goToError() {
            window.location.href = '/templates/sample/html/failed.html';
        }

        function setStatus(texto) {
            const el = document.getElementById('status');
            if (el) el.textContent = texto;
        }

        // Tolerante a elemento ausente: hoje a tela é só imagem e não tem esses
        // ids. Sem a guarda, o modo QR estático quebrava aqui e o catch do
        // init() mandava a pessoa para o failed.html sem nenhum erro real.
        function aplicarTextos(titulo, instrucao, detalhe) {
            const textos = { titulo, instrucao, detalhe };
            for (const [id, valor] of Object.entries(textos)) {
                const el = document.getElementById(id);
                if (el) el.textContent = valor;
            }
        }

        // A query string é a fonte mais confiável: quem chega pelo recall pulou
        // o form.html, e o localStorage ainda guarda a sessão ANTERIOR.
        function resolveSession() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('sid') || localStorage.getItem('session_id');
            const slug = params.get('slug') || localStorage.getItem('slug');

            if (sessionId) localStorage.setItem('session_id', sessionId);
            if (slug) localStorage.setItem('slug', slug);

            return { sessionId, slug };
        }

        async function fetchSession(sessionId) {
            const res = await fetch(`/api/sample/session/${sessionId}`);
            if (!res.ok) throw new Error(`session fetch ${res.status}`);
            return res.json();
        }

        // Fluxo com Unity: o totem fecha a sessão no RESULTADO.cs.
        // O celular apenas acompanha o status para não disparar retirada cedo.
        async function waitForTotemAndPoll(sessionId) {
            const started = Date.now();
            while (Date.now() - started < POLL_MAX_MS) {
                await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
                const session = await fetchSession(sessionId);
                if (session.status === 'processing') {
                    setStatus('Liberando sua amostra na máquina…');
                }
                if (session.status === 'completed') {
                    window.location.href = '/api/sample/thanks';
                    return;
                }
                if (session.status === 'failed' || session.status === 'aborted') {
                    goToError();
                    return;
                }
            }
            goToError();
        }

        // Fluxo QR estático: agenda o ciclo no servidor e acompanha por polling.
        // Em refresh da página, retoma do status atual sem repetir o POST.
        async function startPickupAndPoll(sessionId, slug, currentStatus) {
            if (currentStatus === 'completed') {
                window.location.href = '/api/sample/thanks';
                return;
            }
            if (currentStatus === 'failed' || currentStatus === 'aborted') {
                goToError();
                return;
            }
            if (currentStatus !== 'processing') {
                const res = await fetch('/api/sample/session/pickup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, slug }),
                });
                if (!res.ok) throw new Error(`pickup ${res.status}`);
            }

            const started = Date.now();
            while (Date.now() - started < POLL_MAX_MS) {
                await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
                const session = await fetchSession(sessionId);
                if (session.status === 'completed') {
                    window.location.href = '/api/sample/thanks';
                    return;
                }
                if (session.status === 'failed' || session.status === 'aborted') {
                    goToError();
                    return;
                }
            }
            goToError();
        }

        async function init() {
            const { sessionId, slug } = resolveSession();
            if (!sessionId || !slug) return;

            try {
                const session = await fetchSession(sessionId);
                if (session.mode === 'qrcode_static') {
                    // Sem jogo nesse modo: a máquina libera assim que detecta a mão.
                    aplicarTextos(
                        'ESTENDA A MÃO NA MÁQUINA',
                        'Posicione a mão no sensor para receber sua amostra.',
                        'Pode deixar esta tela aberta até a amostra cair.'
                    );
                    await startPickupAndPoll(sessionId, slug, session.status);
                } else {
                    await waitForTotemAndPoll(sessionId);
                }
            } catch (_) {
                goToError();
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
