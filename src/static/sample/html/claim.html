<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Machine - Retire sua Amostra</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #f4f4f5; color: #18181b; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 1.5rem; }
        .page-tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: #71717a; margin-bottom: .5rem; }
        h1 { font-size: 1.3rem; margin: 0 0 .75rem; }
        p { margin: .25rem 0; line-height: 1.5; }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-tag">claim.html — retirada / liberação</div>
        <h1>RETIRE SUA AMOSTRA</h1>
        <p>Dispara o drop na máquina (totem/Unity) ou o pickup no modo QR estático.</p>
        <p>No modo QR estático faz polling da sessão e vai para <code>thanks</code> ou <code>error</code>.</p>
    </div>

    <script>
        const POLL_INTERVAL_MS = 2000;
        const POLL_MAX_MS = 90000;


        function goToError() {
            window.location.href = '/templates/sample/html/error.html';
        }

        async function fetchSession(sessionId) {
            const res = await fetch(`/api/sample/session/${sessionId}`);
            if (!res.ok) throw new Error(`session fetch ${res.status}`);
            return res.json();
        }

        // Fluxo com Unity: o totem fecha a sessão no RESULTADO.cs.
        // O celular apenas acompanha o status para não disparar retirada cedo.
        async function waitForTotemAndPoll(sessionId) {
            const started = Date.now();
            while (Date.now() - started < POLL_MAX_MS) {
                await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
                const session = await fetchSession(sessionId);
                if (session.status === 'completed') {
                    window.location.href = '/api/sample/thanks';
                    return;
                }
                if (session.status === 'failed' || session.status === 'aborted') {
                    goToError();
                    return;
                }
            }
            goToError();
        }

        // Fluxo QR estático: agenda o ciclo no servidor e acompanha por polling.
        // Em refresh da página, retoma do status atual sem repetir o POST.
        async function startPickupAndPoll(sessionId, slug, currentStatus) {
            if (currentStatus === 'completed') {
                window.location.href = '/api/sample/thanks';
                return;
            }
            if (currentStatus === 'failed' || currentStatus === 'aborted') {
                goToError();
                return;
            }
            if (currentStatus !== 'processing') {
                const res = await fetch('/api/sample/session/pickup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, slug }),
                });
                if (!res.ok) throw new Error(`pickup ${res.status}`);
            }

            const started = Date.now();
            while (Date.now() - started < POLL_MAX_MS) {
                await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
                const session = await fetchSession(sessionId);
                if (session.status === 'completed') {
                    window.location.href = '/api/sample/thanks';
                    return;
                }
                if (session.status === 'failed' || session.status === 'aborted') {
                    goToError();
                    return;
                }
            }
            goToError();
        }

        async function init() {
            const sessionId = localStorage.getItem('session_id');
            const slug = localStorage.getItem('slug');
            if (!sessionId || !slug) return;

            try {
                const session = await fetchSession(sessionId);
                if (session.mode === 'qrcode_static') {
                    await startPickupAndPoll(sessionId, slug, session.status);
                } else {
                    await waitForTotemAndPoll(sessionId);
                }
            } catch (_) {
                goToError();
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
